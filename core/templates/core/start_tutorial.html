{% extends "core/base.html" %}
{% block title %}Start Tutorial{% endblock %}
{% block content %}
<div class="card p-4">
    <h4>{{ tutorial.course.course_code }} — {{ tutorial.date }}</h4>
    <p class="text-muted">Your attendance for this tutorial has been recorded.</p>
    <a href="{{ tutorial.teams_link }}" target="_blank" class="btn btn-primary">Open Microsoft Teams</a>
    <a href="{% url 'lecturer_timetable' %}" class="mt-3">Back to My Timetable</a>
</div>
{% endblock %}

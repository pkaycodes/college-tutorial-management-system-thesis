{% extends "core/base.html" %}
{% block title %}Report an Issue{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4>Report an Issue — {{ tutorial.course.course_code }} ({{ tutorial.date }})</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    {{ form.description }}
                </div>
                <button type="submit" class="btn btn-danger">Submit Complaint</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
